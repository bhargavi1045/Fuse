name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

jobs:
  deploy-backend:
    name: Deploy backend to Render
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Trigger backend deploy hook
        env:
          DEPLOY_HOOK_URL: ${{ secrets.RENDER_BACKEND_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK_URL" ]; then
            echo "Backend deploy hook is not configured; skipping deployment."
            exit 0
          fi
          echo "Deploying backend to Render..."
          curl --fail --show-error --silent -X POST "$DEPLOY_HOOK_URL"

  deploy-frontend:
    name: Deploy frontend to Render
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Trigger frontend deploy hook
        env:
          DEPLOY_HOOK_URL: ${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK_URL" ]; then
            echo "Frontend deploy hook is not configured; skipping deployment."
            exit 0
          fi
          echo "Deploying frontend to Render..."
          curl --fail --show-error --silent -X POST "$DEPLOY_HOOK_URL"
